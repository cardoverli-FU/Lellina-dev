# Render.com deployment config for Lellina
# Safe to commit — contains NO secrets (all env values set in dashboard).
#
# TWO SERVICES (fully separated per Phase 5 architecture):
#   1. lellina-dev       — Next.js app: UI, auth, REST API, profiles, admin
#   2. lellina-chat      — Socket.io chat-service: stateless real-time transport
#
# ARCHITECTURE (bro's vision — confirmed correct):
#   - Chat-service = pure transport layer (no data storage of its own)
#   - Main app = source of truth for auth, profiles, CRUD
#   - BOTH services connect to the SAME Turso (libsql) database
#   - Single source of truth = zero sync conflicts
#
# DATABASE (REQUIRED — Turso for production):
#   Both services MUST have DATABASE_URL set to the SAME Turso URL.
#   Turso is the shared database that makes the separation work.
#   Format: libsql://<your-db>.turso.io?authToken=<token>
#
#   ⚠️  KNOWN ISSUE (next agent will fix):
#   Prisma 6.19's libsql driver adapter has a URL_INVALID bug.
#   - Main app: falls back to file:./db/lellina.db (ephemeral SQLite) for now
#   - chat-service: same fallback
#   - NEXT AGENT will rewrite chat-service with @libsql/client (no Prisma)
#     to use Turso directly. This makes chat-service truly stateless.
#   Until then: set DATABASE_URL to Turso URL in dashboard on BOTH services.
#   If Prisma throws URL_INVALID, fall back to file:./db/lellina.db (single-service mode).

services:
  # ─── SERVICE 1: Next.js App ───────────────────────────────────────
  - type: web
    name: lellina-dev
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    # npm install runs automatically before buildCommand.
    # package-lock.json ensures npm is used (not yarn/bun).
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /api/exchange-rate
    autoDeploy: true
    envVars:
      # All values set in Render dashboard (batch paste from the list below).
      # sync: false = the value is NOT read from this file; it's a dashboard secret.
      # DATABASE_URL MUST be the SAME Turso URL on both services (shared DB).
      # Set in Render dashboard: libsql://<db>.turso.io?authToken=<token>
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_CHANNEL_URL
        sync: false
      - key: WHATSAPP_CHANNEL_URL
        sync: false
      - key: SIGHTENGINE_API_USER
        sync: false
      - key: SIGHTENGINE_API_SECRET
        sync: false
      - key: HUGGINGFACE_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
      # npm strict peer-dep checking breaks on next-auth/nodemailer version mismatch.
      # This makes `npm install` behave like `--legacy-peer-deps` (same as bun).
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
      # ─── Chat Service URL (for socket-client.ts to connect to) ───
      # Set this in Render dashboard to the chat-service's public URL:
      #   https://lellina-chat.onrender.com
      # If not set, the app falls back to sandbox gateway pattern (?XTransformPort=3003).
      - key: NEXT_PUBLIC_CHAT_SERVICE_URL
        sync: false

  # ─── SERVICE 2: Socket.io Chat Service ────────────────────────────
  # Deploys from repo ROOT (not mini-services/chat-service) so that:
  #   1. prisma/schema.prisma is present → `prisma generate` works
  #   2. @prisma/client is generated into root node_modules
  #   3. Node resolves it when bun runs mini-services/chat-service/index.ts
  # Without this, the chat-service throws "@prisma/client did not initialize yet".
  - type: web
    name: lellina-chat
    runtime: bun
    plan: free
    region: oregon
    branch: main
    rootDir: .
    # npm install runs automatically (postinstall: prisma generate).
    # Explicit prisma generate ensures the client is ready before start.
    buildCommand: npx prisma generate
    startCommand: bun mini-services/chat-service/index.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Must match the Next.js app's NEXTAUTH_SECRET (for JWT verification).
      - key: NEXTAUTH_SECRET
        sync: false
      # Comma-separated list of allowed origins for CORS.
      # Set to the Next.js app's URL: https://lellina-dev.onrender.com
      - key: CHAT_ALLOWED_ORIGINS
        sync: false
      # Database URL — MUST be the SAME Turso URL as the main app.
      # This is how the two services share data (bro's architecture).
      # Set in Render dashboard: libsql://<db>.turso.io?authToken=<token>
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
